name: build

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - version.txt
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - version.txt
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
    - name: Repository checkout
      uses: actions/checkout@v7
    - name: JDK setup
      uses: actions/setup-java@v5
      with:
        java-version: 17
        distribution: temurin
    - name: Gradle setup
      uses: gradle/actions/setup-gradle@v6
    - name: Gradle wrapper validation
      uses: gradle/actions/wrapper-validation@v6
    - name: Build and test
      run: ./gradlew build --continue --no-configuration-cache
      env:
        TEST_PROFILE: ci
